# 수집 감시 — Worker 의 /status 를 읽어 문제가 있으면 워크플로를 실패시킨다.
# GitHub 는 예약 워크플로가 실패하면 저장소 소유자에게 이메일을 보내므로,
# 별도 알림 서비스 없이(비용 0원) 수집 중단을 알 수 있다.
#
# 판정과 진단은 tools/watch.mjs 에 있다. 인라인 스크립트였을 때는 손볼 때마다
# YAML 안의 따옴표를 피해 다녀야 했고 로컬에서 돌려볼 수도 없었다.
#
# 실패 조건
#   · 마지막 수집이 3시간 넘게 없음  (크론이 멈췄거나 Worker 가 죽음)
#   · ok 가 true 가 아님             (전 소스 실패 → 이전 데이터 유지 중)
#   · warnings 가 비어 있지 않음      (3회 연속 실패·연속 0건·급감·일반명사 아티스트 등 파서 이상)
#   · errors 에 있는 소스가 health 에서도 2회 이상 연속 실패
# 한 시간짜리 일시 오류(KOPIS 522 등)는 다음 실행에서 스스로 회복되므로 알리지 않는다.
#
# 문제가 있을 때만 자가 진단을 붙인다 — 중계 파일의 저장소·Pages 시각 비교,
# 다른 워크플로의 최근 결과. 메일만 보고 원인에 닿을 수 있어야 한다.
#
# 주의: 공개 저장소의 예약 워크플로는 60일간 커밋이 없으면 GitHub 가 자동으로 끈다.
#       매주 도는 artists.yml 과 6시간마다 도는 relay-jp.yml 이 커밋을 남기는 동안은 괜찮다.
#       Actions 탭에 "disabled" 표시가 뜨면 Enable 을 눌러 다시 켠다.

name: Watch collector

on:
  schedule:
    - cron: "30 */6 * * *"     # 6시간마다 (UTC 00:30 · 06:30 · 12:30 · 18:30)
  workflow_dispatch:

permissions:
  contents: read
  actions: read                # 진단에서 다른 워크플로의 최근 결과를 읽는다

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: /status 점검
        env:
          STATUS_URL: https://onstage-collector.onstage-collector.workers.dev/status
          PAGES_URL: https://none0423.github.io/onstage
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/watch.mjs
