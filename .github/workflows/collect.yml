# 티켓 정보 자동 수집 — 1시간마다 실행
# GitHub 크론은 정시에 딱 맞지 않고 몇 분~수십 분 밀릴 수 있습니다(무료 티어 공통).
name: Collect ticket info

on:
  schedule:
    - cron: "7 * * * *"     # 매시 07분 (UTC 기준이지만 매시 실행이라 시차 무관)
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공연 정보 수집
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: node tools/collect.mjs

      - name: 데이터 형식 검사
        run: node tools/check.mjs

      - name: 변경분 커밋
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/feed.js)" ]; then
            git config user.name  "onstage-collector"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feed.js
            git commit -m "chore(feed): 티켓 정보 자동 수집 $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "변경 없음 — 커밋/배포를 건너뜁니다"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # 봇이 push 해도 deploy.yml 의 on:push 는 실행되지 않으므로 직접 호출한다
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
